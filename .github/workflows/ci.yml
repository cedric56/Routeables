name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release
  # Routeables.Maui multi-targets android/ios/maccatalyst/windows, which no single
  # runner can build. CiBuild=true makes Routeables.Maui.csproj build only its plain
  # net10.0 target (the one Routeables.Test references). Do NOT pass
  # -p:TargetFrameworks globally: it makes NuGet treat every single-TFM project as
  # multi-targeted and some packages' .props (Avalonia, ...) are then not imported.
  CI_PROPS: -p:CiBuild=true

jobs:
  build-and-test:
    name: Build & test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/Routeables.Test/Routeables.Test.csproj ${{ env.CI_PROPS }}

      - name: Build
        run: dotnet build tests/Routeables.Test/Routeables.Test.csproj --no-restore -c ${{ env.CONFIGURATION }} ${{ env.CI_PROPS }}

      # .NET 10 SDK: `dotnet test` runs xunit.v3 through Microsoft.Testing.Platform,
      # enabled by global.json. The project is passed with --project.
      - name: Test
        run: dotnet test --project tests/Routeables.Test/Routeables.Test.csproj --no-build -c ${{ env.CONFIGURATION }} ${{ env.CI_PROPS }}


      # The two flavours of the modal view model are shipped as source: these projects compile them with their packages and test them.
      - name: Flavours (CommunityToolkit.Mvvm and ReactiveUI)
        run: |
          dotnet test --project tests/Routeables.Test.Community/Routeables.Test.Community.csproj -c ${{ env.CONFIGURATION }} ${{ env.CI_PROPS }}
          dotnet test --project tests/Routeables.Test.Reactive/Routeables.Test.Reactive.csproj -c ${{ env.CONFIGURATION }} ${{ env.CI_PROPS }}

  # ---------------------------------------------------------------------------------------------------------------------------
  # Compile every project of the solution, so that an error in a sample or a Reshape no longer waits for a local build.
  # The libraries and the tests are built above with CiBuild (Release, strict analyzers); the samples are built here in
  # Debug, which also compiles what is under #if DEBUG. CiBuild is not set: it would make the samples fail on the
  # trimming warnings meant for the libraries.
  # ---------------------------------------------------------------------------------------------------------------------------

  web-and-desktop:
    name: Build Razor, Blazor, Avalonia (desktop, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Routeables.Blazor references Routeables.Native, which targets Android on Linux: restoring it needs this workload, even to build
      # a project that only uses its net10.0 target.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      # Avalonia.Browser needs the WebAssembly build tools (its Release configuration also compiles ahead of time; Debug does not).
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-web-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-web-

      - name: Libraries and Reshapes
        run: |
          dotnet build src/Routeables.Blazor/Routeables.Blazor.csproj -c Debug
          dotnet build src/Routeables.Avalonia/Routeables.Avalonia.csproj -c Debug
          dotnet build reshapes/Reshapes.Blazor.MudBlazor/Reshapes.Blazor.MudBlazor.csproj -c Debug
          dotnet build reshapes/Reshapes.Avalonia.Fluent/Reshapes.Avalonia.Fluent.csproj -c Debug

      - name: Samples, Razor and Blazor
        run: |
          dotnet build samples/Bases/XAnimals.ViewModels/XAnimals.ViewModels.csproj -c Debug
          dotnet build samples/Blazor/XAnimals.Blazor/XAnimals.Blazor.csproj -c Debug
          dotnet build samples/Blazor/XAnimals.BlazorApp/XAnimals.BlazorApp.csproj -c Debug
          dotnet build samples/Blazor/XAnimals.BlazorWebAssembly/XAnimals.BlazorWebAssembly.csproj -c Debug
          # The Razor Pages sample: the web application builds the Razor class library (XAnimals.Razor) it references.
          dotnet build samples/Razor/XAnimals.WebApplication/XAnimals.WebApplication.csproj -c Debug

      - name: Samples, Avalonia
        run: |
          dotnet build samples/XAnimals.Avalonia/XAnimals.Avalonia.csproj -c Debug
          dotnet build samples/XAnimals.Avalonia.Desktop/XAnimals.Avalonia.Desktop.csproj -c Debug
          dotnet build samples/XAnimals.Avalonia.Browser/XAnimals.Avalonia.Browser.csproj -c Debug

      - name: Benchmarks
        run: dotnet build src/Routeables.Benchmarks/Routeables.Benchmarks.csproj -c Release

      # Not a timing: the history grows by one entry per route change, the pages that leave it can be collected, the disposable ones are disposed.
      - name: Leak check
        run: dotnet run --project src/Routeables.Benchmarks/Routeables.Benchmarks.csproj -c Release --no-build -- --leak
      - name: Performance gate
        # Allocations per route change (tight) and time relative to a fixed loop (loose) against src/Routeables.Benchmarks/perf-baseline.json.
        # After a change that moves them on purpose: dotnet run ... -- --perf <path of the baseline> --update, in a commit of its own.
        run: dotnet run --project src/Routeables.Benchmarks/Routeables.Benchmarks.csproj -c Release --no-build -- --perf

  # The Uno projects are in a job of their own: they were written without being able to restore Uno Platform, so a failure here
  # must not hide the result of the jobs above. Once it is green, fold it into web-and-desktop.
  uno:
    name: Build Uno
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-uno-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-uno-

      - name: Uno libraries
        run: |
          dotnet build src/Routeables.Uno/Routeables.Uno.csproj -c Debug -p:CiBuild=true
          dotnet build src/Routeables.WinUI3/Routeables.WinUI3.csproj -c Debug -p:CiBuild=true

      - name: Sample, Uno (desktop)
        run: dotnet build samples/XAnimals.Uno/XAnimals.Uno.csproj -c Debug -p:CiBuild=true

  # WPF runs on Windows only, so it is a job of its own. Like the Uno job, it starts separate: the project was written where
  # the Windows Desktop targeting pack was not available. Once it is green, fold it into build-and-test.
  wpf:
    name: Build WPF
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-wpf-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-wpf-

      - name: WPF library
        run: dotnet build src/Routeables.Wpf/Routeables.Wpf.csproj -c Debug ${{ env.CI_PROPS }}

      - name: Sample, WPF
        run: dotnet build samples/XAnimals.Wpf/XAnimals.Wpf.csproj -c Debug

      # WinUI 3 and the native notifications build their Windows target here (CiBuild would keep the empty net10.0 one).
      - name: WinUI 3 library and Routeables.Native (Windows)
        run: |
          dotnet build src/Routeables.Native/Routeables.Native.csproj -c Debug
          dotnet build src/Routeables.WinUI3/Routeables.WinUI3.csproj -c Debug

      - name: Pack
        run: dotnet pack src/Routeables.Wpf/Routeables.Wpf.csproj -c Release -o artifacts

  winui3:
    name: Build WinUI 3
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-winui3-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-winui3-

      - name: WinUI 3 library
        run: dotnet build src/Routeables.WinUI3/Routeables.WinUI3.csproj -c Debug

      - name: Sample, WinUI 3
        run: dotnet build samples/XAnimals.WinUI3/XAnimals.WinUI3.csproj -c Debug

  # ---------------------------------------------------------------------------------------------------------------------------
  # The AOT / trimming guarantee, proven rather than declared: a console app using the libraries the way an application does is
  # published with Native AOT (any trim or AOT warning fails the publish) and the native binary is run (a navigation that only
  # worked through reflection fails). The Blazor WebAssembly sample is then published trimmed, and any trim warning raised
  # by Routeables code fails the job.
  # ---------------------------------------------------------------------------------------------------------------------------

  aot:
    name: Native AOT and trimming
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Native AOT clang
        # The mirrors of the runner are sometimes unreachable for a while ("Temporary failure resolving"): nothing is installed when the tools are
        # there already, and apt tries again before it gives up.
        run: |
          if ! command -v clang >/dev/null || ! dpkg -s zlib1g-dev >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=5 update || true
            sudo apt-get -o Acquire::Retries=5 install -y clang zlib1g-dev
          fi

      - name: Publish Native AOT smoke app
        run: dotnet publish src/Routeables.AotSmoke/Routeables.AotSmoke.csproj -c Release -r linux-x64 -o artifacts/aot-smoke

      - name: Run the native binary
        run: ./artifacts/aot-smoke/Routeables.AotSmoke

      # Routeables.Blazor references Routeables.Native, which targets Android on Linux: restoring it needs this workload, even to build
      # a project that only uses its net10.0 target.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      # A Blazor WebAssembly Release publish trims by default. Do not pass PublishTrimmed on the command line: it is a global
      # property, so it also reaches Routeables.Generated (netstandard2.0), which cannot be trimmed (NETSDK1124).
      - name: Publish Blazor WebAssembly trimmed
        shell: bash
        run: |
          dotnet publish samples/Blazor/XAnimals.BlazorWebAssembly/XAnimals.BlazorWebAssembly.csproj -c Release -p:TrimmerSingleWarn=false -o artifacts/wasm 2>&1 | tee wasm-publish.log
          if grep -E "warning IL[23][0-9]{3}" wasm-publish.log | grep -i "routeables"; then
            echo "::error::Routeables raised trim warnings"; exit 1
          fi

  # ---------------------------------------------------------------------------------------------------------------------------
  # The packages: the Routeables package holds six libraries and the generator (Routeables.Abstraction is a package of its own), and no package may depend on one of those
  # libraries as if it were a package of its own. The packages that need a MAUI or Uno workload are not packed here.
  # ---------------------------------------------------------------------------------------------------------------------------

  minimum-sdk:
    name: Generator with the oldest supported SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      # A source generator loads only into a compiler at least as new as the Roslyn it references: with an older one the build warns (CS8032)
      # and no route is generated. The runner has newer SDKs too, so this one is the only one global.json accepts.
      - name: Use exactly SDK 10.0.100
        run: |
          dotnet new globaljson --sdk-version 10.0.100 --roll-forward disable --force
          test "$(dotnet --version)" = "10.0.100"

      - name: Build the sample view models, which are generated
        run: dotnet build samples/Bases/XAnimals.ViewModels/XAnimals.ViewModels.csproj -c Release -warnaserror:CS8032
  # ---------------------------------------------------------------------------------------------------------------------------

  packages:
    name: Pack and check the packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Routeables.Blazor references Routeables.Native, which targets Android on Linux: restoring it needs this workload, even to build
      # a project that only uses its net10.0 target.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Check the dependencies written in the nuspec
        run: bash .github/scripts/check-nuspec.sh

      - name: Pack
        run: |
          dotnet pack src/Routeables.Abstraction/Routeables.Abstraction.csproj -c Release -o artifacts
          dotnet pack src/Routeables.Core/Routeables.Core.csproj -c Release -o artifacts
          dotnet pack src/Routeables.Native/Routeables.Native.csproj -c Release -o artifacts
          dotnet pack src/Routeables.Blazor/Routeables.Blazor.csproj -c Release -o artifacts
          dotnet pack src/Routeables.Avalonia/Routeables.Avalonia.csproj -c Release -o artifacts

      - name: Check the dependencies and the content
        run: bash .github/scripts/check-packages.sh artifacts

  android:
    name: Build Android (MAUI, Avalonia)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # .NET for Android needs a recent JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-android-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-android-

      - name: MAUI
        run: |
          dotnet build src/Routeables.Maui/Routeables.Maui.csproj -c Debug -f net10.0-android
          dotnet build reshapes/Reshapes.Maui.Community/Reshapes.Maui.Community.csproj -c Debug -f net10.0-android
          dotnet build samples/XAnimals.Maui/XAnimals.Maui.csproj -c Debug -f net10.0-android
          dotnet build samples/Blazor/XAnimals.MauiHybrid/XAnimals.MauiHybrid.csproj -c Debug -f net10.0-android

      - name: Avalonia
        run: dotnet build samples/XAnimals.Avalonia.Android/XAnimals.Avalonia.Android.csproj -c Debug

  maui-windows:
    name: Build MAUI (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-maui-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-maui-

      # bash, not PowerShell: PowerShell only reports the exit code of the last command of a script, so an earlier failed build would pass.
      - name: MAUI
        shell: bash
        run: |
          # Every project is built even when an earlier one fails, and only the errors are printed, so one run shows all of them.
          failed=0
          for project in \
            src/Routeables.Maui/Routeables.Maui.csproj \
            reshapes/Reshapes.Maui.Community/Reshapes.Maui.Community.csproj \
            samples/XAnimals.Maui/XAnimals.Maui.csproj \
            samples/Blazor/XAnimals.MauiHybrid/XAnimals.MauiHybrid.csproj; do
            echo "::group::$project"
            if ! dotnet build "$project" -c Debug -f net10.0-windows10.0.19041.0 -nologo -clp:ErrorsOnly; then
              echo "::error title=MAUI Windows build failed::$project"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  # Apple targets depend on the Xcode version the runner has, which .NET pins: a mismatch fails here without meaning the code is
  # wrong. It reports but does not block (continue-on-error); remove that line once it runs green.
  apple:
    name: Build iOS and Mac Catalyst (not blocking)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # .NET for iOS / Mac Catalyst 26.0 requires exactly Xcode 26.0; the runner selects a newer one by default.
      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Install MAUI workloads
        # The whole maui workload, not only the Apple ones: a project that targets android as well is restored for every one of its
        # target frameworks, so building it for Mac Catalyst still needs the android workload.
        run: dotnet workload install maui ios --skip-manifest-update

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-apple-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-apple-

      - name: MAUI, Mac Catalyst
        run: |
          dotnet build samples/XAnimals.Maui/XAnimals.Maui.csproj -c Debug -f net10.0-maccatalyst
          dotnet build samples/Blazor/XAnimals.MauiHybrid/XAnimals.MauiHybrid.csproj -c Debug -f net10.0-maccatalyst

      # actool compiles the asset catalog against the iOS simulator SDK, even for a device build, and needs the matching simulator
      # runtime. The runner image only has the runtimes of newer Xcode versions, so the one of Xcode 26.0 is downloaded.
      # The download sometimes fails with "Unable to connect to simulator" (CoreSimulator not up yet): ask again, a few times.
      - name: Install the iOS runtime of Xcode 26.0
        run: |
          for attempt in 1 2 3 4; do
            # Wake CoreSimulator up (and restart it after a failure): the download talks to it.
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            xcrun simctl list runtimes >/dev/null 2>&1 || true
            sleep 10
            sudo xcodebuild -downloadPlatform iOS && exit 0
            echo "Attempt $attempt failed"; sleep 30
          done
          exit 1

      # Built for a device, without signing.
      - name: MAUI and Avalonia, iOS
        run: |
          dotnet build samples/XAnimals.Maui/XAnimals.Maui.csproj -c Debug -f net10.0-ios -r ios-arm64 -p:EnableCodeSigning=false
          dotnet build samples/XAnimals.Avalonia.iOS/XAnimals.Avalonia.iOS.csproj -c Debug -r ios-arm64 -p:EnableCodeSigning=false
  # ---------------------------------------------------------------------------------------------------------------------------
  # UI tests. The headless ones (Avalonia, Playwright on Blazor, Uno desktop) block the build like the other tests. The device ones
  # (Android emulator, Windows, Apple) depend on the runner image and report without blocking (continue-on-error).
  # ---------------------------------------------------------------------------------------------------------------------------

  ui-avalonia:
    name: UI tests (Avalonia headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build tests/Routeables.Test.Avalonia/Routeables.Test.Avalonia.csproj -c ${{ env.CONFIGURATION }} ${{ env.CI_PROPS }}

      - name: Test
        run: dotnet test --project tests/Routeables.Test.Avalonia/Routeables.Test.Avalonia.csproj --no-build -c ${{ env.CONFIGURATION }} ${{ env.CI_PROPS }}

  ui-playwright:
    name: UI tests (Playwright, Blazor)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Routeables.Blazor references Routeables.Native, which targets Android on Linux: restoring it needs this workload, even to build
      # a project that only uses its net10.0 target.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      # Builds the project and the Blazor sample it starts (a project reference).
      - name: Build
        run: dotnet build tests/Routeables.Test.Playwright/Routeables.Test.Playwright.csproj -c ${{ env.CONFIGURATION }}

      # --with-deps asks apt for system packages (fonts, libraries): the mirrors of the runner are sometimes unreachable for a while, and the build
      # of the whole job was lost for that. It tries again, then installs the browser alone: the libraries it needs are on the image already.
      - name: Install Chromium
        run: |
          playwright="tests/Routeables.Test.Playwright/bin/${{ env.CONFIGURATION }}/net10.0/playwright.ps1"
          for attempt in 1 2 3; do
            pwsh "$playwright" install --with-deps chromium && exit 0
            echo "Attempt $attempt failed; trying again in 20 seconds."
            sleep 20
          done
          echo "The system packages could not be installed; installing the browser alone."
          pwsh "$playwright" install chromium

      - name: Test
        run: dotnet test --project tests/Routeables.Test.Playwright/Routeables.Test.Playwright.csproj --no-build -c ${{ env.CONFIGURATION }}


  ui-uno:
    name: UI tests (Uno, desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-uno-test-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-uno-test-

      - name: Screen and fonts for the Skia head
        run: |
          sudo apt-get -o Acquire::Retries=5 update || true
          sudo apt-get -o Acquire::Retries=5 install -y xvfb libfontconfig1 libx11-6 libxkbcommon0 libice6 libsm6

      - name: Build
        run: dotnet build tests/Routeables.Test.Uno/Routeables.Test.Uno.csproj -c ${{ env.CONFIGURATION }} ${{ env.CI_PROPS }}

      # The application runs its tests on start when these are set, writes the results and exits.
      - name: Test
        env:
          UNO_RUNTIME_TESTS_RUN_TESTS: '{}'
          UNO_RUNTIME_TESTS_OUTPUT_PATH: ${{ github.workspace }}/uno-results.xml
        run: xvfb-run -a dotnet tests/Routeables.Test.Uno/bin/${{ env.CONFIGURATION }}/net10.0-desktop/Routeables.Test.Uno.dll

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uno-results
          path: uno-results.xml
          if-no-files-found: warn


  # ---------------------------------------------------------------------------------------------------------------------------
  # Device tests of the MAUI host (Routeables.Test.Maui): the application runs the tests on the platform. `dotnet msbuild -t:VSTest`
  # starts it on a device, reads the results and stops it. global.json turns on the Microsoft.Testing.Platform runner for the whole repository, which `dotnet test` of
  # a MAUI device project does not use: the VSTest target of DeviceRunners is called directly. One job per kind of device; none blocks the build while they are new.
  # ---------------------------------------------------------------------------------------------------------------------------

  device-android:
    name: Device tests (MAUI, Android emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      # The emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # MAUI plays no animation when the system has them off: it jumps to the end, and the tests of where a transition starts see nothing.
          disable-animations: false
          script: dotnet msbuild tests/Routeables.Test.Maui/Routeables.Test.Maui.csproj -restore -t:VSTest -p:DeviceTfm=net10.0-android -p:Configuration=Debug

      # The logcat of the run (test-results/logcat.txt) says why an application that started sent no result: keep it, whatever the outcome.
      - name: Keep the logcat and the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maui-android-test-results
          path: tests/Routeables.Test.Maui/test-results
          if-no-files-found: ignore

  device-windows:
    name: Device tests (MAUI, Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Test
        run: dotnet msbuild tests/Routeables.Test.Maui/Routeables.Test.Maui.csproj -restore -t:VSTest -p:DeviceTfm=net10.0-windows10.0.19041.0 -p:Configuration=Debug


  device-apple:
    name: Device tests (MAUI, Mac Catalyst and iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Install MAUI workloads
        run: dotnet workload install maui ios --skip-manifest-update

      # The download sometimes fails with "Unable to connect to simulator" (CoreSimulator not up yet): ask again, a few times.
      - name: Install the iOS runtime of Xcode 26.0
        run: |
          for attempt in 1 2 3 4; do
            # Wake CoreSimulator up (and restart it after a failure): the download talks to it.
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            xcrun simctl list runtimes >/dev/null 2>&1 || true
            sleep 10
            sudo xcodebuild -downloadPlatform iOS && exit 0
            echo "Attempt $attempt failed"; sleep 30
          done
          exit 1

      - name: Test, Mac Catalyst
        run: dotnet msbuild tests/Routeables.Test.Maui/Routeables.Test.Maui.csproj -restore -t:VSTest -p:DeviceTfm=net10.0-maccatalyst -p:Configuration=Debug

      # DeviceRunners runs the application on a simulator that is already booted ("No booted iOS simulator found" otherwise): boot an iPhone
      # of the runtime that was downloaded, creating one when the runner has none.
      - name: Boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS' in runtime:
                  for device in devices:
                      if 'iPhone' in device['name']:
                          print(device['udid']); raise SystemExit
          ")
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list runtimes available -j | python3 -c "
          import json, sys
          print([r['identifier'] for r in json.load(sys.stdin)['runtimes'] if r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS')][-1])
          ")
            devicetype=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          print([d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if 'iPhone' in d['name']][-1])
          ")
            udid=$(xcrun simctl create "Routeables iPhone" "$devicetype" "$runtime")
          fi
          echo "Simulator $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "DEVICERUNNERS_SIMULATOR=$udid" >> "$GITHUB_ENV"

      # The simulator is named to the DeviceRunners CLI (DeviceRunnersDevice): it looked for a booted one and found none, though this one was.
      - name: Test, iOS simulator
        run: |
          xcrun simctl list devices booted
          dotnet msbuild tests/Routeables.Test.Maui/Routeables.Test.Maui.csproj -restore -t:VSTest -p:DeviceTfm=net10.0-ios -p:Configuration=Debug -p:DeviceRunnersDevice="$DEVICERUNNERS_SIMULATOR"

      # An application that never reports ("TCP listener timed out", Total=0) crashed or stalled at launch: its log says which, so print what matters of it here.
      - name: Show why the application did not report
        if: failure()
        run: |
          log=tests/Routeables.Test.Maui/test-results/ios-device-log.txt
          if [ -f "$log" ]; then
            wc -l "$log"
            echo "--- errors, crashes, terminations of com.routeables.test.maui ---"
            grep -iE "routeables|fatal|crash|terminat|exception|jetsam|killed|SIGABRT|SIGKILL|assert" "$log" | tail -n 80
            echo "--- last 60 lines ---"
            tail -n 60 "$log"
          else
            echo "No device log was written."
          fi
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i routeables || true

      # The log of the simulator (test-results/ios-device-log.txt) says why an application that crashed did: keep it, whatever the outcome.
      - name: Keep the device log and the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maui-apple-test-results
          path: tests/Routeables.Test.Maui/test-results
          if-no-files-found: ignore