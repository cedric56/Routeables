name: Native smoke

# The native smoke tests of the XAnimals samples (agent-desktop/): each page of the menu, the first animal of each list and
# Back, each dialog of the Dialogs page. They drive real windows with physical clicks and take 5 to 20 minutes per platform,
# so they run on demand and every night, not on each push.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # WPF, Avalonia, MAUI, Uno, WinUI 3. A hosted Windows runner has an interactive desktop: UI Automation and physical clicks work
  # there. Its screen is small (1024x768): it is enlarged first.
  windows:
    name: Windows (WPF, Avalonia, MAUI, Uno, WinUI 3)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          dotnet workload install maui --skip-manifest-update
          npm install -g agent-desktop
      - name: Screen 1920x1080
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Smoke
        shell: pwsh
        run: ./agent-desktop/run-all.ps1 -Only Desktop -Build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-windows
          path: |
            out/native-smoke
            out/all-smoke

  # Avalonia on Linux, on a virtual screen (Xvfb) with a window manager (openbox: maximize) and the AT-SPI bus. The same script
  # as in WSL. Uno is not tested on Linux: its Skia renderer has no AT-SPI support yet.
  # The script starts its own X server on TCP (DISPLAY=127.0.0.1:N): agent-desktop 1.2.0 does not connect to an X server listening
  # only on the abstract socket. Not blocking until a first green run on a hosted runner.
  linux:
    name: Linux (Avalonia)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth x11-utils openbox at-spi2-core dbus-x11 libfontconfig1 libice6 libsm6 libx11-6 libxrandr2 libxi6 libxcursor1 libgl1 libegl1
          npm config set prefix ~/.npm-global
          npm install -g agent-desktop
      - name: Smoke
        run: |
          xvfb-run -a bash -c 'ROUTEABLES_X=xvfb bash agent-desktop/lib/wsl-run.sh "$PWD" Avalonia 0 1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-linux
          path: out/native-smoke-wsl

  # Avalonia on macOS, on a real Mac (Apple Silicon). Not Uno: on macOS, Uno 6.7 empties its accessibility tree after the first
  # page change. A hosted macOS runner has a logged-in desktop, and its
  # agent (/opt/hca/hosted-compute-agent) holds the Accessibility permission; macOS grants it to what a step starts, since the
  # agent is their responsible process (see configure-tccdb-macos.sh in actions/runner-images): agent-desktop needs no setup.
  # Not blocking until a first green run.
  macos:
    name: macOS (Avalonia)
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # On macOS, Routeables.Avalonia and Routeables.Native also target net10.0-android, net10.0-ios and net10.0-maccatalyst, and
      # restore needs the workload of every target, even for the desktop build (NETSDK1147). Only installed, never built here.
      - name: Tools
        run: |
          dotnet workload install android ios maccatalyst --skip-manifest-update
          npm install -g agent-desktop
      # Stops at once, with the reason, if agent-desktop cannot read the other applications (instead of failing every page).
      - name: Accessibility permission
        shell: pwsh
        run: |
          $report = agent-desktop permissions | ConvertFrom-Json
          $report.data | ConvertTo-Json -Depth 5
          if ($report.data.accessibility.state -ne 'granted') {
            Write-Error "agent-desktop has no Accessibility permission on this runner: $($report.data.accessibility | ConvertTo-Json -Compress)"
          }
      - name: Smoke
        shell: pwsh
        # From a .app bundle (the system serves notifications only to one), through the notifications of the Dialogs page up to the one of the
        # system. The first time, macOS asks for the permission: the smoke presses Allow (best effort; the evidence is in the artifact).
        run: ./agent-desktop/run-all.ps1 -Only Desktop -Build -Notifications -Bundle -RequireSystemNotification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-macos
          path: |
            out/native-smoke
            out/all-smoke

  # MAUI and Avalonia on iOS, in the iOS Simulator of a hosted Mac, read and tapped with idb (agent-desktop does not drive the
  # Simulator). Xcode, its iOS runtime and the simulator as in the device-apple job of ci.yml. Not Uno: its iOS accessibility with
  # the Skia renderer is not done yet. Not blocking until a first green run.
  ios:
    name: iOS (MAUI, Avalonia)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Workloads
        run: dotnet workload install maui ios --skip-manifest-update
      - name: Install the iOS runtime of Xcode 26.0
        run: |
          for attempt in 1 2 3 4; do
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            xcrun simctl list runtimes >/dev/null 2>&1 || true
            sleep 10
            sudo xcodebuild -downloadPlatform iOS && exit 0
            echo "Attempt $attempt failed"; sleep 30
          done
          exit 1
      - name: Boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS' in runtime:
                  for device in devices:
                      if 'iPhone' in device['name']:
                          print(device['udid']); raise SystemExit
          ")
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list runtimes available -j | python3 -c "
          import json, sys
          print([r['identifier'] for r in json.load(sys.stdin)['runtimes'] if r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS')][-1])
          ")
            devicetype=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          print([d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if 'iPhone' in d['name']][-1])
          ")
            udid=$(xcrun simctl create "Routeables iPhone" "$devicetype" "$runtime")
          fi
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "IOS_UDID=$udid" >> "$GITHUB_ENV"
      - name: Smoke
        shell: pwsh
        run: ./agent-desktop/run-ios.ps1 -Setup -Build -Udid $env:IOS_UDID -KeepSimulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke
          path: out/ios-smoke

  # MAUI and Avalonia on Android, in an emulator with hardware acceleration (KVM, enabled on the hosted Linux runners).
  # Not Uno yet: its Android app starts but exposes no text to uiautomator (its screen is a few nodes with no text), so every page
  # would fail; add it back (build step and -Hosts) once run-android.ps1 passes it on a local emulator.
  # EmbedAssembliesIntoApk: a Debug APK leaves the .NET assemblies out by default (fast deployment); installed with adb, it would
  # stop at start.
  android:
    name: Android (MAUI, Avalonia)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Workloads
        run: dotnet workload install android maui-android --skip-manifest-update
      # Built before the emulator starts: run-android.ps1 then finds the APKs and only installs them.
      - name: Build the APKs
        run: |
          dotnet build samples/XAnimals.Maui/XAnimals.Maui.csproj -c Debug -f net10.0-android -p:TreatWarningsAsErrors=false -p:EmbedAssembliesIntoApk=true
          dotnet build samples/XAnimals.Avalonia.Android/XAnimals.Avalonia.Android.csproj -c Debug -p:TreatWarningsAsErrors=false -p:EmbedAssembliesIntoApk=true
      - name: Smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -no-snapshot-save -no-boot-anim -gpu swiftshader_indirect -noaudio
          script: pwsh agent-desktop/run-android.ps1 -Serial emulator-5554 -AndroidSdk "$ANDROID_HOME" -Hosts Maui,Avalonia
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: out/android-smoke
