name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # No build: CodeQL reads the C# sources itself, so the MAUI, WinUI and Uno workloads are not needed.
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
