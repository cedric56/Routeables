name: Docs

# Builds the DocFX site (docs/) and publishes it to GitHub Pages.
# One-time setup: repository Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'Routeables.*/**/*.cs'
      - 'Routeables.*/**/*.csproj'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Same setup as ci.yml: Routeables.Maui references the MAUI workload even when only net10.0 is built.
      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore the documented projects
        shell: pwsh
        run: |
          foreach ($p in 'Abstraction','Routing','Core','Razor','Maui','Avalonia','Wpf','Uno') {
            dotnet restore "Routeables.$p/Routeables.$p.csproj" -p:CiBuild=true
          }

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Build the site
        run: docfx docs/docfx.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
