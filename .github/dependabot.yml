version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      avalonia:
        patterns: ["Avalonia*", "FluentAvalonia*"]
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test*", "NSubstitute*", "BenchmarkDotNet*", "Microsoft.Playwright*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
