<!DOCTYPE html>
<html>

<head>
    <title>XAnimals</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5B35E0">
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./app.css" />
</head>

<body style="margin: 0; overflow: hidden">
<div id="out">
    <div class="avalonia-splash">
        <div class="splash-card">
            <svg class="splash-mark" viewBox="0 0 128 128" role="img" aria-label="Routeables">
                <defs>
                    <linearGradient id="splash-bg" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#7C5CFF"/>
                        <stop offset="1" stop-color="#4A22C8"/>
                    </linearGradient>
                </defs>
                <rect width="128" height="128" rx="28" fill="url(#splash-bg)"/>
                <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M44 98 V30 H70 C94 30 94 68 70 68 H44"/>
                    <path d="M68 68 L90 98"/>
                </g>
                <circle cx="44" cy="98" r="10" fill="#FFFFFF"/>
                <circle cx="90" cy="98" r="10" fill="#4A22C8" stroke="#FFFFFF" stroke-width="7"/>
            </svg>
            <h1 class="splash-title">XAnimals</h1>
            <p class="splash-sub">Routeables on Avalonia</p>
            <span class="splash-bar" role="progressbar" aria-label="Loading"></span>
        </div>
    </div>
</div>
<script type='module' src="./main.js"></script>
</body>

</html>
