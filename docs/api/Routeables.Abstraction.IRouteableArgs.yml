  summary: >-
    What travels with a navigation: the values the view model is built with, the ones the view is built with, neutral values for the

    lifecycle hooks, and the route. Build it with the <code>For…</code> and <code>With…</code> methods, which chain:

    <code>RouteableArgs.Create().WithViewModel("id", 42).WithValue("animal", animal)</code>.
