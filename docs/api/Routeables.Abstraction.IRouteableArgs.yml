  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: >-
    The router that is navigating: set by the router itself, for the view model it builds. A view model whose constructor

    takes an <xref href="Routeables.Abstraction.IRouter" data-throw-if-not-resolved="false"></xref> receives this one, so a page shown in a region navigates that region, not the default

    router. <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> outside a navigation. Ignored when a router is already given with <code>ForViewModel</code>.
