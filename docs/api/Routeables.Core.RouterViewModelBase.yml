  assemblies:
  - Routeables.Core
  namespace: Routeables.Core
  summary: >-
    When implemented in a derived class, notifies the UI that the executability of commands

    (e.g. those depending on <xref href="Routeables.Core.RouterViewModelBase.CanGoBack" data-throw-if-not-resolved="false"></xref> or <xref href="Routeables.Core.RouterViewModelBase.CanGoForward" data-throw-if-not-resolved="false"></xref>) may have changed.
  example: []
  syntax:
    content: protected abstract void RaiseCanExecutesChanged()
    content.vb: Protected MustOverride Sub RaiseCanExecutesChanged()
  overload: Routeables.Core.RouterViewModelBase.RaiseCanExecutesChanged*
