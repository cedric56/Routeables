    id: OnViewModelChanged
    path: ../Routeables.Core/Bases/RouterViewModelBase.cs
    startLine: 75
  assemblies:
  - Routeables.Core
  namespace: Routeables.Core
  summary: >-
    Called whenever navigation changes the active view model, e.g. via <xref href="Routeables.Core.RouterViewModelBase.GoBack" data-throw-if-not-resolved="false"></xref> or <xref href="Routeables.Core.RouterViewModelBase.GoForward" data-throw-if-not-resolved="false"></xref>.

    The base implementation refreshes command availability.
  example: []
  syntax:
    content: protected virtual void OnViewModelChanged(object? viewModel)
    parameters:
    - id: viewModel
      type: System.Object
      description: The view model that has become active.
    content.vb: Protected Overridable Sub OnViewModelChanged(viewModel As Object)
  overload: Routeables.Core.RouterViewModelBase.OnViewModelChanged*
  nameWithType.vb: RouterViewModelBase.OnViewModelChanged(Object)
  fullName.vb: Routeables.Core.RouterViewModelBase.OnViewModelChanged(Object)
  name.vb: OnViewModelChanged(Object)
