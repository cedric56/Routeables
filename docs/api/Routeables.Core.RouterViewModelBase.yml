    id: GoBack
    path: ../Routeables.Core/Bases/RouterViewModelBase.cs
    startLine: 29
  assemblies:
  - Routeables.Core
  namespace: Routeables.Core
  summary: >-
    Navigates to the previous view model in the router's history, if available.

    <xref href="Routeables.Core.RouterViewModelBase.OnViewModelChanged(System.Object)" data-throw-if-not-resolved="false"></xref> is only called when the navigation succeeded (it is not when a guard

    cancelled it), and receives the view model that is now current.
  example: []
  syntax:
    content: public virtual Task GoBack()
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Overridable Function GoBack() As Task
  overload: Routeables.Core.RouterViewModelBase.GoBack*
