  namespace: Routeables.Abstraction
  summary: >-
    Typed counterpart of <xref href="Routeables.Abstraction.IInitializeAsync" data-throw-if-not-resolved="false"></xref>: receives the strongly typed data passed by

    <code>GoToRouteAsync&lt;TViewModel, TData&gt;</code>. The generic call only compiles when the target view model

    implements <code>IInitializeAsync&lt;TData&gt;</code>, so the data type is checked at compile time.
  remarks: >-
    Called after <xref href="Routeables.Abstraction.IInitializeAsync.InitializeAsync(Routeables.Abstraction.IRouteableArgs%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>. The interface is contravariant, so a view model

    implementing <code>IInitializeAsync&lt;object&gt;</code> accepts any data type.
  example: []
