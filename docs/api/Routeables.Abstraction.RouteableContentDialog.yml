    path: ../Routeables.Abstraction/Services/IRouteableContentDialogService.cs
    startLine: 126
  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: Occurs after the dialog starts to close, but before it is closed and before the Closed event occurs.
  remarks: >-
    Return <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> to cancel the close and keep the

    dialog open; return <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> to allow it to proceed.

    The <xref href="System.String" data-throw-if-not-resolved="false"></xref> argument identifies which button/action

    triggered the close (implementation-defined, e.g. "Primary",

    "Secondary", "Close", or "Dismiss").
  example: []
  syntax:
    content: public Func<string, bool>? Closing
    return:
      type: System.Func{System.String,System.Boolean}
    content.vb: Public Closing As Func(Of String, Boolean)
