  summary: >-
    The main view model of an application: the menu entries, the one that is selected and the view it shows. Each host binds its

    menu to <xref href="Routeables.Abstraction.IMainRouteables.Routeables" data-throw-if-not-resolved="false"></xref> and <xref href="Routeables.Abstraction.IMainRouteables.Routable" data-throw-if-not-resolved="false"></xref>, and shows <xref href="Routeables.Abstraction.IMainRouteables.CurrentView" data-throw-if-not-resolved="false"></xref>. Register it with

    <code>RegisterMainRouteables</code>: one instance per host (a singleton on Avalonia and MAUI, scoped on Blazor Server).
  example: []
  syntax:
    content: public interface IMainRouteables
    content.vb: Public Interface IMainRouteables
