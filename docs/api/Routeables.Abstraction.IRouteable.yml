- uid: Routeables.Abstraction.IRouteable.OnNavigatedFromAsync(Routeables.Abstraction.IRouteableArgs,System.Threading.CancellationToken)
  commentId: M:Routeables.Abstraction.IRouteable.OnNavigatedFromAsync(Routeables.Abstraction.IRouteableArgs,System.Threading.CancellationToken)
  id: OnNavigatedFromAsync(Routeables.Abstraction.IRouteableArgs,System.Threading.CancellationToken)
  parent: Routeables.Abstraction.IRouteable
  langs:
  - csharp
  - vb
  name: OnNavigatedFromAsync(IRouteableArgs, CancellationToken)
  nameWithType: IRouteable.OnNavigatedFromAsync(IRouteableArgs, CancellationToken)
  fullName: Routeables.Abstraction.IRouteable.OnNavigatedFromAsync(Routeables.Abstraction.IRouteableArgs, System.Threading.CancellationToken)
  type: Method
  source:
    remote:
      path: Routeables.Abstraction/Interfaces/IRouteable.cs
      branch: master
      repo: https://github.com/cedric56/Routeables
    id: OnNavigatedFromAsync
    path: ../Routeables.Abstraction/Interfaces/IRouteable.cs
    startLine: 29
  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: >-
    Called on the entry that was left, once the navigation is committed to the history (Prism's <code>OnNavigatedFrom</code>).

    Unlike <xref href="Routeables.Abstraction.IRouteable.OnNavigatingFromAsync(Routeables.Abstraction.IRouteableArgs%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>, it cannot fail or veto the navigation: an exception thrown here is

    swallowed, because the history has already moved. It runs before the entries that left the history are disposed.
  example: []
  syntax:
    content: Task OnNavigatedFromAsync(IRouteableArgs context, CancellationToken ct = default)
    parameters:
    - id: context
      type: Routeables.Abstraction.IRouteableArgs
    - id: ct
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task
    content.vb: Function OnNavigatedFromAsync(context As IRouteableArgs, ct As CancellationToken = Nothing) As Task
  overload: Routeables.Abstraction.IRouteable.OnNavigatedFromAsync*
- uid: Routeables.Abstraction.IRouteable.OnNavigatedToAsync(Routeables.Abstraction.IRouteableArgs,System.Threading.CancellationToken)
