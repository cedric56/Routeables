  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: >-
    The lifecycle of a page, all of it optional: a view model implements the members it needs, and the router calls them around a

    navigation. In order: <xref href="Routeables.Abstraction.IRouteable.CanNavigateAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> on the page being left (it may refuse), then <xref href="Routeables.Abstraction.IRouteable.OnNavigatingFromAsync(Routeables.Abstraction.IRouteableArgs%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>

    and <xref href="Routeables.Abstraction.IRouteable.OnNavigatingToAsync(Routeables.Abstraction.IRouteableArgs%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> before the change, and <xref href="Routeables.Abstraction.IRouteable.OnNavigatedFromAsync(Routeables.Abstraction.IRouteableArgs%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> and <xref href="Routeables.Abstraction.IRouteable.OnNavigatedToAsync(Routeables.Abstraction.IRouteableArgs%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>

    once it is committed to the history.
