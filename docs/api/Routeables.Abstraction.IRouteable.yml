  name: OnNavigatedToAsync(IRouteableArgs, CancellationToken)
  nameWithType: IRouteable.OnNavigatedToAsync(IRouteableArgs, CancellationToken)
  fullName: Routeables.Abstraction.IRouteable.OnNavigatedToAsync(Routeables.Abstraction.IRouteableArgs, System.Threading.CancellationToken)
  type: Method
  source:
    remote:
      path: Routeables.Abstraction/Interfaces/IRouteable.cs
      branch: master
      repo: https://github.com/cedric56/Routeables
    id: OnNavigatedToAsync
    path: ../Routeables.Abstraction/Interfaces/IRouteable.cs
    startLine: 35
  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: >-
    Called on the entry that is now current, once the navigation is committed to the history (Prism's <code>OnNavigatedTo</code>),

    after <xref href="Routeables.Abstraction.IRouteable.OnNavigatedFromAsync(Routeables.Abstraction.IRouteableArgs%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> of the entry that was left. Same rules: no veto, exceptions are swallowed.
  example: []
  syntax:
    content: Task OnNavigatedToAsync(IRouteableArgs context, CancellationToken ct = default)
    parameters:
    - id: context
      type: Routeables.Abstraction.IRouteableArgs
    - id: ct
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task
    content.vb: Function OnNavigatedToAsync(context As IRouteableArgs, ct As CancellationToken = Nothing) As Task
  overload: Routeables.Abstraction.IRouteable.OnNavigatedToAsync*
