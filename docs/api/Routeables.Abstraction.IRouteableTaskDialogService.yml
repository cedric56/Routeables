  namespace: Routeables.Abstraction
  summary: Shows the dialog and awaits the user's response.
  example: []
  syntax:
    content: Task<RouteableTaskDialogResult> ShowAsync(RouteableTaskDialog @params, params RouteableTaskDialogResult[] results)
    parameters:
    - id: params
      type: Routeables.Abstraction.RouteableTaskDialog
      description: The content, header, icon, and callbacks to show.
    - id: results
      type: Routeables.Abstraction.RouteableTaskDialogResult[]
      description: >-
        The set of standard results (e.g. OK/Cancel, Yes/No) the dialog

        should offer as buttons. The platform adapter renders one button

        per value supplied here.
    return:
      type: System.Threading.Tasks.Task{Routeables.Abstraction.RouteableTaskDialogResult}
      description: >-
        The <xref href="Routeables.Abstraction.RouteableTaskDialogResult" data-throw-if-not-resolved="false"></xref> corresponding to

        whichever button the user tapped, or

        <xref href="Routeables.Abstraction.RouteableTaskDialogResult.None" data-throw-if-not-resolved="false"></xref> if the dialog was

        dismissed without tapping a button.
    content.vb: Function ShowAsync(params As RouteableTaskDialog, ParamArray results As RouteableTaskDialogResult()) As Task(Of RouteableTaskDialogResult)
