  summary: >-
    Turns the icon key of a page (<xref href="Routeables.Abstraction.IRouteableView.Path" data-throw-if-not-resolved="false"></xref>) into what a platform displays.

    A menu entry has no container to ask, so the resolvers of the application are kept here, once for the process, in

    <xref href="Routeables.Abstraction.IconResolver.Default" data-throw-if-not-resolved="false"></xref>; a view that names its own <xref href="Routeables.Abstraction.IRouteableView.Icons" data-throw-if-not-resolved="false"></xref> uses those instead.
