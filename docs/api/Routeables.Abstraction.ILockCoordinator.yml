  summary: >-
    Keeps the menu locked while a page refuses to be left: it listens to the lock messages of the broker and locks or unlocks every

    entry of the main view model (see <xref href="Routeables.Abstraction.IMainRouteables.Lock" data-throw-if-not-resolved="false"></xref>). Created by <code>router.CreateLockCoordinator(menu)</code>.
