  assemblies:
  - Routeables.Avalonia
  namespace: Routeables.Avalonia
  summary: >-
    Configures an <xref href="Avalonia.AppBuilder" data-throw-if-not-resolved="false"></xref> for an application-derived type,

    constructing the app instance from the built service provider and registering the standard

    Routeables services, dialogs, and themes.
  example: []
  syntax:
    content: 'public static AppBuilder CreateRouteableApp<TApp>(string icon, Func<IServiceProvider, TApp> appFactory, IMessageBoxService? messageBoxService = null, Action<IServiceCollection>? configureExternalServices = null, Action<IServiceProvider>? afterBuild = null, Action? onDispose = null) where TApp : Application'
    parameters:
    - id: icon
      type: System.String
    - id: appFactory
      type: System.Func{System.IServiceProvider,{TApp}}
      description: A factory that creates the application instance given the built service provider.
    - id: messageBoxService
      type: Routeables.Avalonia.IMessageBoxService
      description: ''
    - id: configureExternalServices
      type: System.Action{Microsoft.Extensions.DependencyInjection.IServiceCollection}
      description: Optional callback to register additional services with the container.
    - id: afterBuild
      type: System.Action{System.IServiceProvider}
      description: Optional callback executed immediately after the service provider is built.
    - id: onDispose
      type: System.Action
      description: Optional callback executed when the application window closes and disposes.
    typeParameters:
    - id: TApp
      description: The application type to configure.
    return:
      type: Avalonia.AppBuilder
      description: The configured <xref href="Avalonia.AppBuilder" data-throw-if-not-resolved="false"></xref>, ready for further setup.
    content.vb: Public Shared Function CreateRouteableApp(Of TApp As Application)(icon As String, appFactory As Func(Of IServiceProvider, TApp), messageBoxService As IMessageBoxService = Nothing, configureExternalServices As Action(Of IServiceCollection) = Nothing, afterBuild As Action(Of IServiceProvider) = Nothing, onDispose As Action = Nothing) As AppBuilder
