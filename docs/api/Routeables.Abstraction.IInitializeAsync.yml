  summary: >-
    Lets a view model (or a view) load what it needs before it is shown. The router calls it on the target once it is built, with the

    arguments of the navigation and before anything of the current page is torn down. For data typed at compile time, see

    <xref href="Routeables.Abstraction.IInitializeAsync%601" data-throw-if-not-resolved="false"></xref>.
