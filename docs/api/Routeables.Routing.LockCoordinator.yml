  assemblies:
  - Routeables.Routing
  namespace: Routeables.Routing
  summary: >-
    Coordinates lock states across routable components based on incoming broker messages.

    It listens with its own subscription: disposing it (or calling <xref href="Routeables.Routing.LockCoordinator.Unsubscribe" data-throw-if-not-resolved="false"></xref>) stops this coordinator only,

    not the others that listen to the same broker.
  example: []
  syntax:
    content: 'public sealed class LockCoordinator : ILockCoordinator, IDisposable'
    content.vb: Public NotInheritable Class LockCoordinator Implements ILockCoordinator, IDisposable
