  assemblies:
  - Routeables.Razor
  namespace: Routeables.Razor
  summary: >-
    Registers the Routeables framework, services, routing engine, dialog services, and MudBlazor configurations 

    into the specified service collection.
  example: []
  syntax:
    content: public static void UseRouteables(this IServiceCollection services, Runtime runtime, Func<IServiceProvider, IRouteableDialogService>? routeableDialogService = null, Func<IServiceProvider, IRouteableContentDialogService>? routeableContentDialogService = null, Func<IServiceProvider, IRouteableTaskDialogService>? routeableTaskDialogService = null, Func<IServiceProvider, IRouteableNotificationService>? routeableNotificationService = null, Func<IServiceProvider, Task>? onCircuitProviderChanged = null, RouteableNotificationPosition position = RouteableNotificationPosition.BottomLeft, int maxDispayments = 5)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to add services to.
    - id: runtime
      type: Routeables.Core.Runtime
      description: The runtime environment settings.
    - id: routeableDialogService
      type: System.Func{System.IServiceProvider,Routeables.Abstraction.IRouteableDialogService}
    - id: routeableContentDialogService
      type: System.Func{System.IServiceProvider,Routeables.Abstraction.IRouteableContentDialogService}
    - id: routeableTaskDialogService
      type: System.Func{System.IServiceProvider,Routeables.Abstraction.IRouteableTaskDialogService}
    - id: routeableNotificationService
      type: System.Func{System.IServiceProvider,Routeables.Abstraction.IRouteableNotificationService}
    - id: onCircuitProviderChanged
      type: System.Func{System.IServiceProvider,System.Threading.Tasks.Task}
      description: Optional callback executed when the circuit provider initializes.
    - id: position
      type: Routeables.Abstraction.RouteableNotificationPosition
      description: The screen position where toast notifications should appear, defaulting to bottom-left.
    - id: maxDispayments
      type: System.Int32
      description: The maximum number of simultaneous notifications displayed, defaulting to 5.
    content.vb: Public Shared Sub UseRouteables(services As IServiceCollection, runtime As Runtime, routeableDialogService As Func(Of IServiceProvider, IRouteableDialogService) = Nothing, routeableContentDialogService As Func(Of IServiceProvider, IRouteableContentDialogService) = Nothing, routeableTaskDialogService As Func(Of IServiceProvider, IRouteableTaskDialogService) = Nothing, routeableNotificationService As Func(Of IServiceProvider, IRouteableNotificationService) = Nothing, onCircuitProviderChanged As Func(Of IServiceProvider, Task) = Nothing, position As RouteableNotificationPosition = RouteableNotificationPosition.BottomLeft, maxDispayments As Integer = 5)
