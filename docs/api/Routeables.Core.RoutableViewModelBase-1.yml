  assemblies:
  - Routeables.Core
  namespace: Routeables.Core
  summary: Determines whether this view model can currently be closed.
  example: []
  syntax:
    content: public virtual Task<bool> CanClose()
    return:
      type: System.Threading.Tasks.Task{System.Boolean}
      description: >-
        A task that resolves to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if closing is allowed; otherwise, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.

        The base implementation always returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>.
    content.vb: Public Overridable Function CanClose() As Task(Of Boolean)
