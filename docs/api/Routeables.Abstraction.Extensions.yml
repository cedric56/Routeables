  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: >-
    Registers the main view model of a host (the menu or tab bar), which is the <xref href="Routeables.Abstraction.IMainRouteables" data-throw-if-not-resolved="false"></xref> the views,

    the lock coordinator and the start selection all refer to.
  remarks: >-
    The host decides the lifetime: <xref href="Microsoft.Extensions.DependencyInjection.ServiceLifetime.Scoped" data-throw-if-not-resolved="false"></xref> for Blazor Server (one per circuit),

    <xref href="Microsoft.Extensions.DependencyInjection.ServiceLifetime.Singleton" data-throw-if-not-resolved="false"></xref> for Avalonia and MAUI. A <xref href="Microsoft.Extensions.DependencyInjection.ServiceLifetime.Transient" data-throw-if-not-resolved="false"></xref> one is refused:

    each resolution would be another instance, so the one the window displays would not be the one that is selected,

    locked or subscribed.
  example: []
  syntax:
    content: 'public static IServiceCollection RegisterMainRouteables<TMain>(this IServiceCollection services, ServiceLifetime lifetime) where TMain : class, IMainRouteables'
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
    - id: lifetime
      type: Microsoft.Extensions.DependencyInjection.ServiceLifetime
    typeParameters:
    - id: TMain
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
    content.vb: Public Shared Function RegisterMainRouteables(Of TMain As {Class, IMainRouteables})(services As IServiceCollection, lifetime As ServiceLifetime) As IServiceCollection
  overload: Routeables.Abstraction.Extensions.RegisterMainRouteables*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: <code class="paramref">lifetime</code> is <xref href="Microsoft.Extensions.DependencyInjection.ServiceLifetime.Transient" data-throw-if-not-resolved="false"></xref>.
  nameWithType.vb: Extensions.RegisterMainRouteables(Of TMain)(IServiceCollection, ServiceLifetime)
  fullName.vb: Routeables.Abstraction.Extensions.RegisterMainRouteables(Of TMain)(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.DependencyInjection.ServiceLifetime)
  name.vb: RegisterMainRouteables(Of TMain)(IServiceCollection, ServiceLifetime)
