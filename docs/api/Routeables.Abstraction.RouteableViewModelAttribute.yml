  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: >-
    Marks a view model as a navigation destination and declares which types may navigate to it.

    For each caller type, the Routeables source generator emits an extension method on that caller

    (<code>GoTo{Name}Async</code>) whose parameters mirror the destination's constructor, so the arguments

    are checked at compile time and the method is visible only on the declared callers.
  remarks: >-
    <p>

    The route template comes from the <xref href="Routeables.Abstraction.RouteableAttribute" data-throw-if-not-resolved="false"></xref> on the same class, or from

    <xref href="Routeables.Abstraction.RouteableViewModelAttribute.Route" data-throw-if-not-resolved="false"></xref>. Every constructor parameter becomes a parameter of the generated method, except

    parameters marked with <xref href="Routeables.Abstraction.FromContainerAttribute" data-throw-if-not-resolved="false"></xref> or <code>[FromKeyedServices]</code>, which are

    resolved from the container. A parameter whose name matches a <code>{placeholder}</code> of the template is

    written into the route instead of being passed as an argument. A constructor parameter of type

    <xref href="Routeables.Abstraction.IRouter" data-throw-if-not-resolved="false"></xref> receives the router the method is called with.

    </p>

    <p>

    The constructor is chosen like <code>ActivatorUtilities</code> does: the one marked

    <code>[ActivatorUtilitiesConstructor]</code>, otherwise the public one with the most parameters.

    </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class, AllowMultiple = true)]

      public sealed class RouteableViewModelAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Class, AllowMultiple:=True)>

      Public NotInheritable Class RouteableViewModelAttribute Inherits Attribute
