  source:
    remote:
      path: Routeables.Abstraction/Services/IRouteableSystemNotificationService.cs
      branch: master
      repo: https://github.com/cedric56/Routeables
    id: CreateNotification
    path: ../Routeables.Abstraction/Services/IRouteableSystemNotificationService.cs
    startLine: 172
  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: >-
    Creates a new, not-yet-shown notification. Call

    <xref href="Routeables.Abstraction.IRouteableSystemNotification.Show" data-throw-if-not-resolved="false"></xref> on the result to display it.
  example: []
  syntax:
    content: Task<IRouteableSystemNotification?> CreateNotification(string? category)
    parameters:
    - id: category
      type: System.String
      description: >-
        The category to create the notification under. If

        <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, the implementation uses a default category;

        otherwise the category must already be defined at app launch.
    return:
      type: System.Threading.Tasks.Task{Routeables.Abstraction.IRouteableSystemNotification}
      description: >-
        The new notification, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> if it couldn't be

        created (e.g. an unrecognized <code class="paramref">category</code>, or the

        platform denies notification permission).
    content.vb: Function CreateNotification(category As String) As Task(Of IRouteableSystemNotification)
