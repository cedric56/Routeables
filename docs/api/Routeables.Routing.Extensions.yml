- uid: Routeables.Routing.Extensions.RegisterRouting(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.DependencyInjection.ServiceLifetime,System.Func{System.IServiceProvider,Routeables.Abstraction.IRouter})
  commentId: M:Routeables.Routing.Extensions.RegisterRouting(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.DependencyInjection.ServiceLifetime,System.Func{System.IServiceProvider,Routeables.Abstraction.IRouter})
  id: RegisterRouting(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.DependencyInjection.ServiceLifetime,System.Func{System.IServiceProvider,Routeables.Abstraction.IRouter})
  isExtensionMethod: true
  parent: Routeables.Routing.Extensions
  langs:
  - csharp
  - vb
  name: RegisterRouting(IServiceCollection, ServiceLifetime, Func<IServiceProvider, IRouter>?)
  nameWithType: Extensions.RegisterRouting(IServiceCollection, ServiceLifetime, Func<IServiceProvider, IRouter>?)
  fullName: Routeables.Routing.Extensions.RegisterRouting(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.DependencyInjection.ServiceLifetime, System.Func<System.IServiceProvider, Routeables.Abstraction.IRouter>?)
  type: Method
  source:
    remote:
      path: Routeables.Routing/Extensions.cs
      branch: master
      repo: https://github.com/cedric56/Routeables
    id: RegisterRouting
    path: ../Routeables.Routing/Extensions.cs
    startLine: 29
  assemblies:
  - Routeables.Routing
  namespace: Routeables.Routing
  summary: >-
    Registers the default (unkeyed) navigation stack: <xref href="Routeables.Abstraction.IRouter" data-throw-if-not-resolved="false"></xref> plus its

    history, gate, and lifecycle helpers, the broker service and the lock-coordinator factory.
  example: []
  syntax:
    content: public static void RegisterRouting(this IServiceCollection services, ServiceLifetime lifetime = ServiceLifetime.Singleton, Func<IServiceProvider, IRouter>? getRouter = null)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to add to.
    - id: lifetime
      type: Microsoft.Extensions.DependencyInjection.ServiceLifetime
      description: >-
        Defaults to <xref href="Microsoft.Extensions.DependencyInjection.ServiceLifetime.Singleton" data-throw-if-not-resolved="false"></xref> so all injectors share one history

        (desktop / MAUI / Avalonia). Prefer <xref href="Microsoft.Extensions.DependencyInjection.ServiceLifetime.Scoped" data-throw-if-not-resolved="false"></xref> on Blazor

        Server so each circuit gets its own stack, or use <xref href="Routeables.Routing.Extensions.AddRegion(Microsoft.Extensions.DependencyInjection.IServiceCollection%2cSystem.String%2cMicrosoft.Extensions.DependencyInjection.ServiceLifetime)" data-throw-if-not-resolved="false"></xref>

        when you need multiple independent panes.

        Do not use <xref href="Microsoft.Extensions.DependencyInjection.ServiceLifetime.Transient" data-throw-if-not-resolved="false"></xref>: each resolve would get a separate

        history and navigation would appear broken across view-models.
    - id: getRouter
      type: System.Func{System.IServiceProvider,Routeables.Abstraction.IRouter}
      description: Optional factory to supply a custom <xref href="Routeables.Abstraction.IRouter" data-throw-if-not-resolved="false"></xref> instead of the default <xref href="Routeables.Routing.Router" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Shared Sub RegisterRouting(services As IServiceCollection, lifetime As ServiceLifetime = ServiceLifetime.Singleton, getRouter As Func(Of IServiceProvider, IRouter) = Nothing)
  overload: Routeables.Routing.Extensions.RegisterRouting*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: <code class="paramref">lifetime</code> is <xref href="Microsoft.Extensions.DependencyInjection.ServiceLifetime.Transient" data-throw-if-not-resolved="false"></xref>.
  nameWithType.vb: Extensions.RegisterRouting(IServiceCollection, ServiceLifetime, Func(Of IServiceProvider, IRouter))
  fullName.vb: Routeables.Routing.Extensions.RegisterRouting(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.DependencyInjection.ServiceLifetime, System.Func(Of System.IServiceProvider, Routeables.Abstraction.IRouter))
  name.vb: RegisterRouting(IServiceCollection, ServiceLifetime, Func(Of IServiceProvider, IRouter))
- uid: Routeables.Routing.Extensions.AddRouteCoordinator(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.DependencyInjection.ServiceLifetime)
