- uid: Routeables.Routing.Extensions.AddRegion(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.String,Microsoft.Extensions.DependencyInjection.ServiceLifetime)
  commentId: M:Routeables.Routing.Extensions.AddRegion(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.String,Microsoft.Extensions.DependencyInjection.ServiceLifetime)
  id: AddRegion(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.String,Microsoft.Extensions.DependencyInjection.ServiceLifetime)
  isExtensionMethod: true
  parent: Routeables.Routing.Extensions
  langs:
  - csharp
  - vb
  name: AddRegion(IServiceCollection, string, ServiceLifetime)
  nameWithType: Extensions.AddRegion(IServiceCollection, string, ServiceLifetime)
  fullName: Routeables.Routing.Extensions.AddRegion(Microsoft.Extensions.DependencyInjection.IServiceCollection, string, Microsoft.Extensions.DependencyInjection.ServiceLifetime)
  type: Method
  source:
    remote:
      path: Routeables.Routing/Extensions.cs
      branch: master
      repo: https://github.com/cedric56/Routeables
    id: AddRegion
    path: ../Routeables.Routing/Extensions.cs
    startLine: 142
  assemblies:
  - Routeables.Routing
  namespace: Routeables.Routing
  summary: >-
    Registers an independent navigation region: a <xref href="Routeables.Routing.Router" data-throw-if-not-resolved="false"></xref> resolved as a keyed

    service under <code class="paramref">route</code>. Use this instead of registering <xref href="Routeables.Routing.Router" data-throw-if-not-resolved="false"></xref>

    as a plain, unkeyed singleton whenever a view model needs more than one independent

    navigation area (e.g. a main pane and a side pane) — resolving an unkeyed singleton twice

    returns the *same* instance, silently merging what were meant to be two separate

    navigation histories.
  example: []
  syntax:
    content: public static IServiceCollection AddRegion(this IServiceCollection services, string route, ServiceLifetime lifetime = ServiceLifetime.Scoped)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to add to.
    - id: route
      type: System.String
      description: The region's identifier, e.g. "main" or "side". Resolve it later with <xref href="Routeables.Abstraction.Extensions.GetRegion(System.IServiceProvider%2cSystem.String)" data-throw-if-not-resolved="false"></xref>
    - id: lifetime
      type: Microsoft.Extensions.DependencyInjection.ServiceLifetime
      description: <xref href="Microsoft.Extensions.DependencyInjection.ServiceLifetime.Scoped" data-throw-if-not-resolved="false"></xref>
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The same <code class="paramref">services</code> instance, for chaining.
    content.vb: Public Shared Function AddRegion(services As IServiceCollection, route As String, lifetime As ServiceLifetime = ServiceLifetime.Scoped) As IServiceCollection
  overload: Routeables.Routing.Extensions.AddRegion*
  nameWithType.vb: Extensions.AddRegion(IServiceCollection, String, ServiceLifetime)
  fullName.vb: Routeables.Routing.Extensions.AddRegion(Microsoft.Extensions.DependencyInjection.IServiceCollection, String, Microsoft.Extensions.DependencyInjection.ServiceLifetime)
  name.vb: AddRegion(IServiceCollection, String, ServiceLifetime)
