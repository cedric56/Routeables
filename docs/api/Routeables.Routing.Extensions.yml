  id: AddRouteCoordinator(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.DependencyInjection.ServiceLifetime)
  isExtensionMethod: true
  parent: Routeables.Routing.Extensions
  langs:
  - csharp
  - vb
  name: AddRouteCoordinator(IServiceCollection, ServiceLifetime)
  nameWithType: Extensions.AddRouteCoordinator(IServiceCollection, ServiceLifetime)
  fullName: Routeables.Routing.Extensions.AddRouteCoordinator(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.DependencyInjection.ServiceLifetime)
  type: Method
  source:
    remote:
      path: Routeables.Routing/Extensions.cs
      branch: master
      repo: https://github.com/cedric56/Routeables
    id: AddRouteCoordinator
    path: ../Routeables.Routing/Extensions.cs
    startLine: 69
  assemblies:
  - Routeables.Routing
  namespace: Routeables.Routing
  summary: >-
    Registers <xref href="Routeables.Abstraction.IRouteCoordinator" data-throw-if-not-resolved="false"></xref>, which runs segment navigations (<code>Orders?id=5/Detail</code>) over the

    registered routers. <xref href="Routeables.Routing.Extensions.RegisterRouting(Microsoft.Extensions.DependencyInjection.IServiceCollection%2cMicrosoft.Extensions.DependencyInjection.ServiceLifetime%2cSystem.Func%7bSystem.IServiceProvider%2cRouteables.Abstraction.IRouter%7d)" data-throw-if-not-resolved="false"></xref> already calls it; call it yourself only when the application

    registers its routers without <xref href="Routeables.Routing.Extensions.RegisterRouting(Microsoft.Extensions.DependencyInjection.IServiceCollection%2cMicrosoft.Extensions.DependencyInjection.ServiceLifetime%2cSystem.Func%7bSystem.IServiceProvider%2cRouteables.Abstraction.IRouter%7d)" data-throw-if-not-resolved="false"></xref> (for example regions only).
  example: []
  syntax:
    content: public static IServiceCollection AddRouteCoordinator(this IServiceCollection services, ServiceLifetime lifetime = ServiceLifetime.Singleton)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to add to.
    - id: lifetime
      type: Microsoft.Extensions.DependencyInjection.ServiceLifetime
      description: >-
        Use the lifetime of the routers it drives: a coordinator resolves region routers from its own provider.

        Transient is not supported (the coordinator exposes events).
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
    content.vb: Public Shared Function AddRouteCoordinator(services As IServiceCollection, lifetime As ServiceLifetime = ServiceLifetime.Singleton) As IServiceCollection
  overload: Routeables.Routing.Extensions.AddRouteCoordinator*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: <code class="paramref">lifetime</code> is <xref href="Microsoft.Extensions.DependencyInjection.ServiceLifetime.Transient" data-throw-if-not-resolved="false"></xref>.
- uid: Routeables.Routing.Extensions.RegisterSegment``1(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.String,System.String,System.String)
  commentId: M:Routeables.Routing.Extensions.RegisterSegment``1(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.String,System.String,System.String)
  id: RegisterSegment``1(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.String,System.String,System.String)
  isExtensionMethod: true
  parent: Routeables.Routing.Extensions
  langs:
  - csharp
  - vb
  name: RegisterSegment<TViewModel>(IServiceCollection, string?, string?, string?)
  nameWithType: Extensions.RegisterSegment<TViewModel>(IServiceCollection, string?, string?, string?)
  fullName: Routeables.Routing.Extensions.RegisterSegment<TViewModel>(Microsoft.Extensions.DependencyInjection.IServiceCollection, string?, string?, string?)
  type: Method
  source:
    remote:
      path: Routeables.Routing/Extensions.cs
      branch: master
      repo: https://github.com/cedric56/Routeables
    id: RegisterSegment
    path: ../Routeables.Routing/Extensions.cs
    startLine: 93
  assemblies:
  - Routeables.Routing
  namespace: Routeables.Routing
  summary: >-
    Makes <code class="typeparamref">TViewModel</code> reachable as a navigation segment. The default name is the type name:

    <code>RegisterSegment&lt;OrdersViewModel&gt;()</code> answers to <code>OrdersViewModel?id=5</code>. The view model must be

    registered with <code>RegisterRoute</code> (without a route template: segments use the default keys, or a literal

    <code class="paramref">route</code> that matches itself).
  example: []
  syntax:
    content: 'public static IServiceCollection RegisterSegment<TViewModel>(this IServiceCollection services, string? name = null, string? route = null, string? template = null) where TViewModel : class'
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to add to.
    - id: name
      type: System.String
      description: The segment name; the view model type name when omitted. Case-insensitive.
    - id: route
      type: System.String
      description: The route key the view model was registered under, if it was not the default one.
    - id: template
      type: System.String
      description: The matching template, if it differs from <code class="paramref">route</code>.
    typeParameters:
    - id: TViewModel
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
    content.vb: Public Shared Function RegisterSegment(Of TViewModel As Class)(services As IServiceCollection, name As String = Nothing, route As String = Nothing, template As String = Nothing) As IServiceCollection
  overload: Routeables.Routing.Extensions.RegisterSegment*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: A segment with the same name is already registered.
  nameWithType.vb: Extensions.RegisterSegment(Of TViewModel)(IServiceCollection, String, String, String)
  fullName.vb: Routeables.Routing.Extensions.RegisterSegment(Of TViewModel)(Microsoft.Extensions.DependencyInjection.IServiceCollection, String, String, String)
  name.vb: RegisterSegment(Of TViewModel)(IServiceCollection, String, String, String)
