  nameWithType: RouterTypedExtensions.GoToRouteAsync<TViewModel, TData>(IRouter, string, TData, string?, CancellationToken, params string[])
  fullName: Routeables.Routing.RouterTypedExtensions.GoToRouteAsync<TViewModel, TData>(Routeables.Abstraction.IRouter, string, TData, string?, System.Threading.CancellationToken, params string[])
  type: Method
  source:
    remote:
      path: Routeables.Routing/RouterTypedExtensions.cs
      branch: master
      repo: https://github.com/cedric56/Routeables
    id: GoToRouteAsync
    path: ../Routeables.Routing/RouterTypedExtensions.cs
    startLine: 41
  assemblies:
  - Routeables.Routing
  namespace: Routeables.Routing
  summary: >-
    Navigates to <code class="typeparamref">TViewModel</code> and hands it <code class="paramref">data</code> through

    <xref href="Routeables.Abstraction.IInitializeAsync%601" data-throw-if-not-resolved="false"></xref>. Does not compile if the view model cannot accept

    <code class="typeparamref">TData</code>.
  example: []
  syntax:
    content: 'public static Task<RouteableResult> GoToRouteAsync<TViewModel, TData>(this IRouter router, string route, TData data, string? template = null, CancellationToken cancellationToken = default, params string[] viewKeys) where TViewModel : class, IInitializeAsync<TData>'
    parameters:
    - id: router
      type: Routeables.Abstraction.IRouter
      description: The router.
    - id: route
      type: System.String
      description: The concrete route.
    - id: data
      type: '{TData}'
      description: The data handed to <xref href="Routeables.Abstraction.IInitializeAsync%601.InitializeAsync(%600%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>.
    - id: template
      type: System.String
      description: The route template; found from the route when omitted.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A token to observe for cancellation.
    - id: viewKeys
      type: System.String[]
      description: Optional view keys, as for <xref href="Routeables.Abstraction.IRouter.GoToRouteAsync%60%601(System.String%2cRouteables.Abstraction.IRouteableArgs%2cSystem.String%2cSystem.Threading.CancellationToken%2cSystem.String%5b%5d)" data-throw-if-not-resolved="false"></xref>.
    typeParameters:
    - id: TViewModel
      description: The destination view model; must implement <code>IInitializeAsync&lt;TData&gt;</code>.
    - id: TData
      description: The type of the data passed to the view model.
    return:
      type: System.Threading.Tasks.Task{Routeables.Abstraction.RouteableResult}
      description: The navigation result.
    content.vb: Public Shared Function GoToRouteAsync(Of TViewModel As {Class, IInitializeAsync(Of TData)}, TData)(router As IRouter, route As String, data As TData, template As String = Nothing, cancellationToken As CancellationToken = Nothing, ParamArray viewKeys As String()) As Task(Of RouteableResult)
  overload: Routeables.Routing.RouterTypedExtensions.GoToRouteAsync*
