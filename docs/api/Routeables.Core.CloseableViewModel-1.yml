  summary: >-
    Compares the current and new values for a given field (which should be the backing field for a property).

    If the value has changed, updates the field and then raises the <xref href="Routeables.Core.CloseableViewModel%601.PropertyChanged" data-throw-if-not-resolved="false"></xref> event.

    This method is just like <xref href="Routeables.Core.CloseableViewModel%601.SetPropertyAndNotifyOnCompletion%60%601(Routeables.Core.CloseableViewModel%7b%600%7d.TaskNotifier%7b%60%600%7d%40%2cSystem.Threading.Tasks.Task%7b%60%600%7d%2cSystem.String)" data-throw-if-not-resolved="false"></xref>,

    with the difference being an extra <xref href="System.Action%601" data-throw-if-not-resolved="false"></xref> parameter with a callback being invoked

    either immediately, if the new task has already completed or is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, or upon completion.
  remarks: The <xref href="Routeables.Core.CloseableViewModel%601.PropertyChanged" data-throw-if-not-resolved="false"></xref> event is not raised if the current and new value for the target property are the same.
