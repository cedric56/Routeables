  summary: >-
    Compares the current and new values for a given property. If the value has changed, updates

    the property with the new value, then raises the <xref href="Routeables.Core.CloseableViewModel%601.PropertyChanged" data-throw-if-not-resolved="false"></xref> event.

    This overload is much less efficient than <xref href="Routeables.Core.CloseableViewModel%601.SetProperty%60%601(%60%600%40%2c%60%600%2cSystem.String)" data-throw-if-not-resolved="false"></xref> and it

    should only be used when the former is not viable (eg. when the target property being

    updated does not directly expose a backing field that can be passed by reference).

    For performance reasons, it is recommended to use a stateful callback if possible through

    the <xref href="Routeables.Core.CloseableViewModel%601.SetProperty%60%602(%60%601%2c%60%601%2c%60%600%2cSystem.Action%7b%60%600%2c%60%601%7d%2cSystem.String)" data-throw-if-not-resolved="false"></xref> whenever possible

    instead of this overload, as that will allow the C# compiler to cache the input callback and

    reduce the memory allocations. More info on that overload are available in the related XML

    docs. This overload is here for completeness and in cases where that is not applicable.
  remarks: The <xref href="Routeables.Core.CloseableViewModel%601.PropertyChanged" data-throw-if-not-resolved="false"></xref> event is not raised if the current and new value for the target property are the same.
