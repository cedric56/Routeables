  summary: >-
    Compares the current and new values for a given field (which should be the backing field for a property).

    If the value has changed, updates the field and then raises the <xref href="Routeables.Core.CloseableViewModel%601.PropertyChanged" data-throw-if-not-resolved="false"></xref> event.

    The behavior mirrors that of <xref href="Routeables.Core.CloseableViewModel%601.SetProperty%60%601(%60%600%40%2c%60%600%2cSystem.String)" data-throw-if-not-resolved="false"></xref>, with the difference being that

    this method will also monitor the new value of the property (a generic <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>) and will also

    raise the <xref href="Routeables.Core.CloseableViewModel%601.PropertyChanged" data-throw-if-not-resolved="false"></xref> again for the target property when it completes.

    This can be used to update bindings observing that <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> or any of its properties.

    This method and its overload specifically rely on the <xref href="Routeables.Core.CloseableViewModel%601.TaskNotifier" data-throw-if-not-resolved="false"></xref> type, which needs

    to be used in the backing field for the target <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> property. The field doesn't need to be

    initialized, as this method will take care of doing that automatically. The <xref href="Routeables.Core.CloseableViewModel%601.TaskNotifier" data-throw-if-not-resolved="false"></xref>

    type also includes an implicit operator, so it can be assigned to any <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> instance directly.

    Here is a sample property declaration using this method:


    <pre><code class="lang-csharp">private TaskNotifier myTask;


    public Task MyTask

    {
        get =&gt; myTask;
        private set =&gt; SetAndNotifyOnCompletion(ref myTask, value);
    }</code></pre>
  remarks: >-
    The <xref href="Routeables.Core.CloseableViewModel%601.PropertyChanged" data-throw-if-not-resolved="false"></xref> event is not raised if the current and new value for the target property are

    the same. The return value being <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> only indicates that the new value being assigned to

    <code class="paramref">taskNotifier</code> is different than the previous one, and it does not mean the new

    <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> instance passed as argument is in any particular state.
