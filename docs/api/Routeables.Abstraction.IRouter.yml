    startLine: 77
  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: >-
    Navigates to a view and a view model you built yourself, adding them to the history. The router does not create anything:

    it binds the view to the view model (<xref href="Routeables.Abstraction.IRouteableFor.Context" data-throw-if-not-resolved="false"></xref>) and runs the lifecycle.
  example: []
  syntax:
    content: Task<RouteableResult> GoAsync(object view, object viewModel, IRouteableArgs? args = null, CancellationToken cancellationToken = default)
    parameters:
    - id: view
      type: System.Object
      description: The view to show.
    - id: viewModel
      type: System.Object
      description: The view model of that view.
