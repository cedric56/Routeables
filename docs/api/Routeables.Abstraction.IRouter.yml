    path: ../Routeables.Abstraction/Interfaces/IRouter.cs
    startLine: 10
  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: >-
    The navigation of an application, or of one region of it: it keeps a history of entries (a view model and its view) and moves a

    cursor through it. Every operation checks the guards of the page being left, runs the lifecycle (<xref href="Routeables.Abstraction.IRouteable" data-throw-if-not-resolved="false"></xref>),

    and returns a <xref href="Routeables.Abstraction.RouteableResult" data-throw-if-not-resolved="false"></xref> instead of throwing when the navigation is refused or fails. The default router is

    the main area; <code>AddRegion</code> registers one more, by name, for a <code>RouteableRegion</code>.
  example: []
  syntax:
    content: public interface IRouter
    content.vb: Public Interface IRouter
