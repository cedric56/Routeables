  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: >-
    Navigates to a registered route by its address, as a browser would: <code>GoToAsync("/orders/42")</code>. The route is looked up in

    the routes registered with an explicit route (<code>RouteableTable</code>) and in the main routeables; its parameters

    (<code>{id:int}</code>, query) are read from <code class="paramref">url</code> and no template is needed. The leading <code>/</code> is optional.

    Fails (without throwing) when no route matches.
  example: []
  syntax:
    content: Task<RouteableResult> GoToAsync(string url, IRouteableArgs? args = null, CancellationToken cancellationToken = default)
    parameters:
    - id: url
      type: System.String
    - id: args
      type: Routeables.Abstraction.IRouteableArgs
    - id: cancellationToken
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task{Routeables.Abstraction.RouteableResult}
    content.vb: Function GoToAsync(url As String, args As IRouteableArgs = Nothing, cancellationToken As CancellationToken = Nothing) As Task(Of RouteableResult)
