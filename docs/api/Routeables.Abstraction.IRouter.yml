  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: >-
    Raised once a navigation attempt is under way (target known, before any guard or lifecycle callback).

    Not raised when there is nothing to do (no back entry, already at the target).

    Raised while the router gate is held: handlers must not start a navigation.
