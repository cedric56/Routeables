  type: Method
  source:
    remote:
      path: Routeables.Abstraction/Services/IRouteableContentDialogService.cs
      branch: master
      repo: https://github.com/cedric56/Routeables
    id: ShowAsync
    path: ../Routeables.Abstraction/Services/IRouteableContentDialogService.cs
    startLine: 21
  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: Begins an asynchronous operation to show the dialog.
  example: []
  syntax:
    content: Task<RouteableContentDialogResult> ShowAsync(RouteableContentDialog @params)
    parameters:
    - id: params
      type: Routeables.Abstraction.RouteableContentDialog
      description: The content, buttons, and callbacks to show.
    return:
      type: System.Threading.Tasks.Task{Routeables.Abstraction.RouteableContentDialogResult}
      description: >-
        A task that completes with the <xref href="Routeables.Abstraction.RouteableContentDialogResult" data-throw-if-not-resolved="false"></xref>

        corresponding to whichever button the user tapped (or

        <xref href="Routeables.Abstraction.RouteableContentDialogResult.None" data-throw-if-not-resolved="false"></xref> if the dialog was dismissed

        without tapping a button, e.g. by pressing Escape or tapping outside).
    content.vb: Function ShowAsync(params As RouteableContentDialog) As Task(Of RouteableContentDialogResult)
