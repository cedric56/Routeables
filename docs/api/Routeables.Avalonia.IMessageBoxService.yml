  assemblies:
  - Routeables.Avalonia
  namespace: Routeables.Avalonia
  summary: Shows a message with buttons and waits for the user to choose one.
  example: []
  syntax:
    content: Task<string?> ShowMessageBoxAsync(string title, string message, string buttons, TopLevel? topLevel = null)
    parameters:
    - id: title
      type: System.String
      description: The title of the dialog.
    - id: message
      type: System.String
      description: The text of the dialog.
    - id: buttons
      type: System.String
      description: The labels of the buttons, written together in PascalCase (<code>"YesNo"</code> gives Yes and No); Ok when empty.
    - id: topLevel
      type: Avalonia.Controls.TopLevel
      description: The window that owns the dialog, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> for the active one.
    return:
      type: System.Threading.Tasks.Task{System.String}
      description: The label of the button that was chosen, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> when the dialog was dismissed.
    content.vb: Function ShowMessageBoxAsync(title As String, message As String, buttons As String, topLevel As TopLevel = Nothing) As Task(Of String)
