  namespace: Routeables.Avalonia
  summary: Shows a task dialog (a message with commands and optional details) and waits for it to close.
  example: []
  syntax:
    content: Task<RouteableTaskDialogResult> ShowAsync(RouteableTaskDialog @params, TopLevel? topLevel = null, params RouteableTaskDialogResult[] results)
    parameters:
    - id: params
      type: Routeables.Abstraction.RouteableTaskDialog
      description: What the dialog shows.
    - id: topLevel
      type: Avalonia.Controls.TopLevel
      description: The window that owns the dialog, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> for the active one.
    - id: results
      type: Routeables.Abstraction.RouteableTaskDialogResult[]
      description: 'The results the dialog may return: they decide which buttons it shows.'
    return:
      type: System.Threading.Tasks.Task{Routeables.Abstraction.RouteableTaskDialogResult}
      description: The result that closed the dialog.
    content.vb: Function ShowAsync(params As RouteableTaskDialog, topLevel As TopLevel = Nothing, ParamArray results As RouteableTaskDialogResult()) As Task(Of RouteableTaskDialogResult)
