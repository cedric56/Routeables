  assemblies:
  - Routeables.Avalonia
  namespace: Routeables.Avalonia
  summary: >-
    Where the dialogs of the Avalonia host are drawn. <code>DefaultMessageBoxService</code> draws them itself; a Reshape (such as

    <code>ReshapeMessageBoxService</code> for FluentAvalonia) replaces it to draw them with a UI library. Pass yours to

    <code>RouteableBuilder.CreateRouteableApp(messageBoxService: ...)</code>.
