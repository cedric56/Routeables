  assemblies:
  - Routeables.Maui
  namespace: Routeables.Maui
  summary: >-
    Displays a platform-native dialog with up to three buttons, using the appropriate native API

    for the current platform (Android alert dialog, WinUI content dialog, or an iOS/Mac Catalyst

    alert controller or form-sheet view controller), and awaits the user's selection.
  example: []
  syntax:
    content: public Task<T?> DisplayThreeButtons<T>(string? title, object? content, string? primaryButtonText, string? secondaryButtonText, string? closeButtonText, T primaryResult, T secondaryResult, T closeResult)
    parameters:
    - id: title
      type: System.String
      description: The dialog title.
    - id: content
      type: System.Object
      description: 'The dialog content: a message string, or a view/element to embed.'
    - id: primaryButtonText
      type: System.String
      description: The primary button's text, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> to omit it.
    - id: secondaryButtonText
      type: System.String
      description: The secondary button's text, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> to omit it.
    - id: closeButtonText
      type: System.String
      description: The close button's text, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> to omit it.
    - id: primaryResult
      type: '{T}'
      description: The result returned if the primary button is selected.
    - id: secondaryResult
      type: '{T}'
      description: The result returned if the secondary button is selected.
    - id: closeResult
      type: '{T}'
      description: The result returned if the close button is selected.
    typeParameters:
    - id: T
      description: The result type associated with each button.
    return:
      type: System.Threading.Tasks.Task{{T}}
      description: The result associated with the button the user selected.
    content.vb: Public Function DisplayThreeButtons(Of T)(title As String, content As Object, primaryButtonText As String, secondaryButtonText As String, closeButtonText As String, primaryResult As T, secondaryResult As T, closeResult As T) As Task(Of T)
  overload: Routeables.Maui.DialogService.DisplayThreeButtons*
