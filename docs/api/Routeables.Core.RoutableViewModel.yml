  summary: >-
    Compares the current and new values for a given nested property. If the value has changed,

    updates the property and then raises the <xref href="Routeables.Core.RoutableViewModel.PropertyChanged" data-throw-if-not-resolved="false"></xref> event.

    The behavior mirrors that of <xref href="Routeables.Core.RoutableViewModel.SetProperty%60%601(%60%600%40%2c%60%600%2cSystem.String)" data-throw-if-not-resolved="false"></xref>,

    with the difference being that this method is used to relay properties from a wrapped model in the

    current instance. This type is useful when creating wrapping, bindable objects that operate over

    models that lack support for notification (eg. for CRUD operations).

    Suppose we have this model (eg. for a database row in a table):


    <pre><code class="lang-csharp">public class Person

    {
        public string Name { get; set; }
    }</code></pre>


    We can then use a property to wrap instances of this type into our observable model (which supports

    notifications), injecting the notification to the properties of that model, like so:


    <pre><code class="lang-csharp">[INotifyPropertyChanged]

    public partial class BindablePerson

    {
        public Model { get; }

        public BindablePerson(Person model)
        {
            Model = model;
        }

        public string Name
        {
            get =&gt; Model.Name;
            set =&gt; Set(Model.Name, value, Model, (model, name) =&gt; model.Name = name);
        }
    }</code></pre>


    This way we can then use the wrapping object in our application, and all those "proxy" properties will

    also raise notifications when changed. Note that this method is not meant to be a replacement for

    <xref href="Routeables.Core.RoutableViewModel.SetProperty%60%601(%60%600%40%2c%60%600%2cSystem.String)" data-throw-if-not-resolved="false"></xref>, and it should only be used when relaying properties to a model that

    doesn't support notifications, and only if you can't implement notifications to that model directly (eg. by having

    it implement <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref>). The syntax relies on passing the target model and a stateless callback

    to allow the C# compiler to cache the function, which results in much better performance and no memory usage.
  remarks: The <xref href="Routeables.Core.RoutableViewModel.PropertyChanged" data-throw-if-not-resolved="false"></xref> event is not raised if the current and new value for the target property are the same.
