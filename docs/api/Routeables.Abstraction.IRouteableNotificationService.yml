  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: Shows a notification.
  example: []
  syntax:
    content: void Show(string title, string message, RouteableNotificationType type = RouteableNotificationType.Information, TimeSpan? expiration = null, Action? onClick = null, Action? onClose = null)
    parameters:
    - id: title
      type: System.String
      description: The notification's title/heading.
    - id: message
      type: System.String
      description: The notification's body text.
    - id: type
      type: Routeables.Abstraction.RouteableNotificationType
      description: >-
        The severity/intent of the notification, used to pick an icon and

        accent color. Defaults to <xref href="Routeables.Abstraction.RouteableNotificationType.Information" data-throw-if-not-resolved="false"></xref>.
    - id: expiration
      type: System.Nullable{System.TimeSpan}
      description: >-
        How long the notification stays visible before auto-dismissing.

        If <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, the platform adapter's default duration

        is used (implementation-defined — some platforms may show the

        notification indefinitely until manually dismissed).
    - id: onClick
      type: System.Action
      description: >-
        Invoked if the user taps/clicks the notification itself (not a

        specific button — this interface has no action-button parameters).
    - id: onClose
      type: System.Action
      description: >-
        Invoked when the notification is dismissed, whether by the user,

        by <code class="paramref">expiration</code> elapsing, or programmatically by

        the platform adapter.
    content.vb: Sub Show(title As String, message As String, type As RouteableNotificationType = RouteableNotificationType.Information, expiration As TimeSpan? = Nothing, onClick As Action = Nothing, onClose As Action = Nothing)
