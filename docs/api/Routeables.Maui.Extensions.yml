      repo: https://github.com/cedric56/Routeables
    id: UseRouteables
    path: ../Routeables.Maui/Extensions.cs
    startLine: 29
  assemblies:
  - Routeables.Maui
  namespace: Routeables.Maui
  summary: >-
    Registers a shared 

    <xref href="Routeables.Abstraction.IRouteableDialogService" data-throw-if-not-resolved="false"></xref>, <xref href="Routeables.Abstraction.IRouteableContentDialogService" data-throw-if-not-resolved="false"></xref>, <xref href="Routeables.Abstraction.IRouteableTaskDialogService" data-throw-if-not-resolved="false"></xref>,

    <xref href="Routeables.Abstraction.IRouteableNotificationService" data-throw-if-not-resolved="false"></xref>, and <xref href="Routeables.Abstraction.IRouteableRequestedThemeService" data-throw-if-not-resolved="false"></xref>),

    a transient <xref href="Routeables.Routing.Router" data-throw-if-not-resolved="false"></xref>,
  remarks: >-
    The modal, content dialog, task dialog and notification services are Routeables' own and need nothing but MAUI.

    Pass a factory to replace one, or call <code>UseRouteablesCommunityToolkit()</code> (Reshapes.Maui.CommunityToolkit)

    to use CommunityToolkit.Maui popups and snackbars instead.
  example: []
  syntax:
    content: public static MauiAppBuilder UseRouteables(this MauiAppBuilder builder, Func<IServiceProvider, IRouteableModalService>? modalService = null, Func<IServiceProvider, IRouteableContentDialogService>? contentDialogService = null, Func<IServiceProvider, IRouteableTaskDialogService>? taskDialogService = null, Func<IServiceProvider, IRouteableNotificationService>? notificationService = null)
    parameters:
    - id: builder
      type: Microsoft.Maui.Hosting.MauiAppBuilder
      description: The MAUI app builder to configure.
    - id: modalService
      type: System.Func{System.IServiceProvider,Routeables.Maui.IRouteableModalService}
      description: Factory of the <xref href="Routeables.Maui.IRouteableModalService" data-throw-if-not-resolved="false"></xref>; null keeps Routeables' own.
    - id: contentDialogService
      type: System.Func{System.IServiceProvider,Routeables.Abstraction.IRouteableContentDialogService}
      description: Factory of the <xref href="Routeables.Abstraction.IRouteableContentDialogService" data-throw-if-not-resolved="false"></xref>; null keeps Routeables' own.
    - id: taskDialogService
      type: System.Func{System.IServiceProvider,Routeables.Abstraction.IRouteableTaskDialogService}
      description: Factory of the <xref href="Routeables.Abstraction.IRouteableTaskDialogService" data-throw-if-not-resolved="false"></xref>; null keeps Routeables' own.
    - id: notificationService
      type: System.Func{System.IServiceProvider,Routeables.Abstraction.IRouteableNotificationService}
      description: Factory of the <xref href="Routeables.Abstraction.IRouteableNotificationService" data-throw-if-not-resolved="false"></xref>; null keeps Routeables' own.
    return:
      type: Microsoft.Maui.Hosting.MauiAppBuilder
      description: The same <code class="paramref">builder</code>, for chaining.
    content.vb: Public Shared Function UseRouteables(builder As MauiAppBuilder, modalService As Func(Of IServiceProvider, IRouteableModalService) = Nothing, contentDialogService As Func(Of IServiceProvider, IRouteableContentDialogService) = Nothing, taskDialogService As Func(Of IServiceProvider, IRouteableTaskDialogService) = Nothing, notificationService As Func(Of IServiceProvider, IRouteableNotificationService) = Nothing) As MauiAppBuilder
  overload: Routeables.Maui.Extensions.UseRouteables*
  nameWithType.vb: Extensions.UseRouteables(MauiAppBuilder, Func(Of IServiceProvider, IRouteableModalService), Func(Of IServiceProvider, IRouteableContentDialogService), Func(Of IServiceProvider, IRouteableTaskDialogService), Func(Of IServiceProvider, IRouteableNotificationService))
  fullName.vb: Routeables.Maui.Extensions.UseRouteables(Microsoft.Maui.Hosting.MauiAppBuilder, System.Func(Of System.IServiceProvider, Routeables.Maui.IRouteableModalService), System.Func(Of System.IServiceProvider, Routeables.Abstraction.IRouteableContentDialogService), System.Func(Of System.IServiceProvider, Routeables.Abstraction.IRouteableTaskDialogService), System.Func(Of System.IServiceProvider, Routeables.Abstraction.IRouteableNotificationService))
  name.vb: UseRouteables(MauiAppBuilder, Func(Of IServiceProvider, IRouteableModalService), Func(Of IServiceProvider, IRouteableContentDialogService), Func(Of IServiceProvider, IRouteableTaskDialogService), Func(Of IServiceProvider, IRouteableNotificationService))
