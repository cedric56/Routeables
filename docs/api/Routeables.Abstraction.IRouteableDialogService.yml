  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: Shows a confirmation dialog with "Yes", "No", and "Cancel" buttons.
  example: []
  syntax:
    content: Task<int> ShowYesNoCancelAsync(string message, string title = "Title")
    parameters:
    - id: message
      type: System.String
      description: The message to display.
    - id: title
      type: System.String
      description: The dialog title.
    return:
      type: System.Threading.Tasks.Task{System.Int32}
      description: >-
        The index of the button chosen. The exact Yes/No/Cancel-to-index

        mapping is defined by the platform implementation of this interface —

        check the concrete adapter (e.g. the Avalonia/MAUI implementation)

        for the authoritative mapping before relying on specific values here.
    content.vb: Function ShowYesNoCancelAsync(message As String, title As String = "Title") As Task(Of Integer)
