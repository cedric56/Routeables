  assemblies:
  - Routeables.Abstraction
  namespace: Routeables.Abstraction
  summary: >-
    Shows an error dialog presenting the given exception's message

    (and, depending on the platform adapter, optionally its stack trace)

    with a single acknowledgement button.
  example: []
  syntax:
    content: Task ShowErrorAsync(Exception ex, string title = "Error")
    parameters:
    - id: ex
      type: System.Exception
      description: The exception to display.
    - id: title
      type: System.String
      description: The dialog title. Defaults to "Error".
    return:
      type: System.Threading.Tasks.Task
