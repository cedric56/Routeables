# Members that are public for the code the source generator writes (or for another Routeables package) but that nobody should call:
# they carry [EditorBrowsable(EditorBrowsableState.Never)], and stay out of the API reference too.
apiRules:
- exclude:
    hasAttribute:
      uid: System.ComponentModel.EditorBrowsableAttribute
      ctorArguments:
      - System.ComponentModel.EditorBrowsableState.Never
